<svg xmlns="http://www.w3.org/2000/svg" width="830" height="150" viewBox="0 0 830 150">
  <defs>
    <linearGradient id="metricBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="828" height="148" rx="14" fill="url(#metricBg)" stroke="#27272a" stroke-width="1"/>

  <!-- Metric 1: Core System -->
  <g transform="translate(36, 20)">
    <rect width="236" height="108" rx="10" fill="url(#cardGrad2)" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="26" class="mono" font-size="10" fill="#71717a" letter-spacing="1">SYSTEM ENGINE</text>
    <text x="18" y="54" class="sans" font-size="22" font-weight="700" fill="#f4f4f5">Evan</text>
    <text x="18" y="74" class="mono" font-size="11" fill="#a1a1aa">Autonomous Core</text>
    <text x="18" y="92" class="mono" font-size="9" fill="#71717a">Integrated Agent Swarm</text>
  </g>

  <!-- Metric 2: Specialized Built Agents -->
  <g transform="translate(296, 20)">
    <rect width="236" height="108" rx="10" fill="url(#cardGrad2)" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="26" class="mono" font-size="10" fill="#71717a" letter-spacing="1">SPECIALIZED AGENTS</text>
    <text x="18" y="54" class="sans" font-size="22" font-weight="700" fill="#f4f4f5">Built Deployments</text>
    <text x="18" y="74" class="mono" font-size="11" fill="#a1a1aa">Maple AI &amp; Agent Shield</text>
    <text x="18" y="92" class="mono" font-size="9" fill="#71717a">Edu &amp; Cybersecurity</text>
  </g>

  <!-- Metric 3: Architecture -->
  <g transform="translate(556, 20)">
    <rect width="236" height="108" rx="10" fill="url(#cardGrad2)" stroke="#27272a" stroke-width="1"/>
    <text x="18" y="26" class="mono" font-size="10" fill="#71717a" letter-spacing="1">INFRASTRUCTURE</text>
    <text x="18" y="54" class="sans" font-size="22" font-weight="700" fill="#f4f4f5">Distributed</text>
    <text x="18" y="74" class="mono" font-size="11" fill="#a1a1aa">Async Event-Driven</text>
    <text x="18" y="92" class="mono" font-size="9" fill="#71717a">Microservices &amp; Real-time APIs</text>
  </g>
</svg>
